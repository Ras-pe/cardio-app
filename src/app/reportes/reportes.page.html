<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Reportes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="page-header">
    <h1>Reportes de Evaluaciones</h1>
    <p>Resultados del modelo ML y estimaciones locales</p>
  </div>

  <div class="reportes-list" *ngIf="reportes.length > 0">
    <div class="reporte-card cardio-card" *ngFor="let r of reportes">
      <div class="reporte-top">
        <div class="reporte-paciente">
          <ion-icon name="person-outline" color="primary"></ion-icon>
          <span>{{ r.paciente }}</span>
        </div>
        <span class="result-label" [class.risk]="r.prediction === 1" [class.no-risk]="r.prediction === 0">
          {{ r.label }}
        </span>
      </div>
      <div class="reporte-meta">
        <span class="reporte-fecha">
          <ion-icon name="calendar-outline"></ion-icon>
          {{ r.fecha }}
        </span>
        <span class="reporte-telefono" *ngIf="r.telefono">
          <ion-icon name="call-outline"></ion-icon>
          {{ r.telefono }}
        </span>
      </div>
      <div class="reporte-bottom">
        <span class="risk-badge" [style.background]="riskColor(r.risk_level)">
          {{ r.risk_level }} ({{ r.probability_risk }}%)
        </span>
        <span class="source-badge" [class.ml]="r.source === 'ML'" [class.local]="r.source === 'local'">
          {{ r.source }}
        </span>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="reportes.length === 0">
    <ion-icon name="document-text-outline"></ion-icon>
    <h2>Sin reportes</h2>
    <p>Aun no hay evaluaciones registradas</p>
  </div>
</ion-content>
